<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Learning — Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- SITE HEADER -->
  <div class="site-header">
    <h1 class="site-title">AI&nbsp;Learning</h1>
    <p class="site-sub">From Python basics to deploying neural networks</p>
  </div>

  <!-- PROGRESS BAR -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>
    <span class="progress-label" id="progress-label">0 / 0 cards seen</span>
  </div>

  <!-- LEARNING TIMELINE TREE -->
  <div class="timeline-wrap" id="timeline-wrap">
    <div class="timeline-scroll" id="timeline-scroll">
      <svg id="timeline-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="tl-info" id="tl-info"></div>
  </div>

  <!-- CARD HEADER -->
  <div class="card-header">
    <div class="badge-row">
      <span class="chapter-badge" id="chapter-badge"></span>
      <span class="topic-badge" id="topic-badge"></span>
    </div>
    <h2 id="card-title"></h2>
  </div>

  <!-- FLASHCARD AREA -->
  <div class="flashcard-area">

    <button class="nav-btn" id="prev-btn" aria-label="Previous card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="card-container">
      <div class="card" id="card">

        <!-- FRONT -->
        <div class="card-face front">
          <div class="code-card">
            <div class="header">
              <span class="dot red"></span>
              <span class="dot yellow"></span>
              <span class="dot green"></span>
              <span class="filename" id="filename">main.py</span>
            </div>
            <pre><code id="code-content"></code></pre>
          </div>
        </div>

        <!-- BACK -->
        <div class="card-face back">
          <div class="back-content" id="back-content"></div>
        </div>

      </div>
      <div class="card-glow"></div>
    </div>

    <button class="nav-btn" id="next-btn" aria-label="Next card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

  </div>

  <!-- INDEX & MARK -->
  <div class="index-area">
    <div class="index-dots" id="index-dots"></div>
    <span class="index-label" id="index-label">1 / 1</span>
    <button class="mark-btn" id="mark-btn">Mark seen</button>
  </div>

  <!-- HINT -->
  <p class="hint">Click card to flip &nbsp;·&nbsp; ← → navigate &nbsp;·&nbsp; Space to flip &nbsp;·&nbsp; M to mark</p>

</div>

<script src="script.js"></script>
</body>
</html>
